name: Publish verified Windows installers
on:
  workflow_dispatch:
    inputs:
      artifacts_json:
        description: Verified full and optional lightweight assets, preferred type and version
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACTS_JSON: ${{ inputs.artifacts_json }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and independently verify every installer
        run: python3 scripts/verify-windows-release.py
      - name: Publish complete release with stable update manifest
        shell: bash
        run: |
          version=$(python3 -c 'import json;print(json.load(open("windows-update.json"))["version"])')
          cat > notes.txt <<'TXT'
          Windows 更新版。已有兼容运行环境时使用轻量 Update.exe；首次安装或修复请使用完整 Setup.exe。
          软件“检查更新”按发布清单选择更新包，安装前请停止任务并退出工作台。
          所有安装包在公开发布前独立核验大小和 SHA-256。用户账号、Cookie、密钥和业务数据不随包发布。
          TXT
          gh release create "v$version" JieliuWorkbench-*.exe JieliuWorkbench-*.sha256 windows-update.json windows-distribution.json --draft --title "Windows $version" --notes-file notes.txt
          gh release edit "v$version" --draft=false --latest
